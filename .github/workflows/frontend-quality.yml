name: Project quality

on:
  pull_request:
    paths:
      - ".github/workflows/frontend-quality.yml"
      - "frontend/**"
      - "marketing/**"
      - "pipeline/**"
      - "infra/aws/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/frontend-quality.yml"
      - "frontend/**"
      - "marketing/**"
      - "pipeline/**"
      - "infra/aws/**"

permissions:
  contents: read

jobs:
  marketing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - run: npm ci
      - run: npm run license:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run license:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
      - run: npm run license:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  aws-infrastructure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            infra/aws/package-lock.json
            pipeline/package-lock.json
      - run: npm ci
        working-directory: pipeline
      - run: npm ci
      - run: npm run license:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run synth
      - run: npm run build

